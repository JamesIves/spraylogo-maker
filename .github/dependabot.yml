version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1; bump together by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
